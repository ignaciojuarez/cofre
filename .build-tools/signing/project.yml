name: CofreSigning
options:
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: APPLE_TEAM_ID
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Cofre:
    type: application
    platform: iOS
    sources: [main.c]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ignaciojuarez.cofre
      CODE_SIGN_ENTITLEMENTS: App.entitlements
      GENERATE_INFOPLIST_FILE: YES
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../extensions/PacketTunnel
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ignaciojuarez.cofre.tunnel
      INFOPLIST_FILE: PacketTunnel-Info.plist
      CODE_SIGN_ENTITLEMENTS: Tunnel.entitlements
schemes:
  CofreSigning:
    build:
      targets:
        Cofre: all
        PacketTunnel: all
