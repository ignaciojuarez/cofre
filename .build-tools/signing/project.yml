name: CofreSigning
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'
packages:
  CofreUI:
    path: ../../app/UI
  CofreServerJoin:
    path: ../../app/ServerJoin
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Cofre:
    type: application
    platform: iOS
    sources: [main.c]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
      CODE_SIGN_ENTITLEMENTS: App.entitlements
      GENERATE_INFOPLIST_FILE: YES
  CofreCore:
    type: framework
    platform: iOS
    sources:
      - path: ../../app/Glue/CofreConstants.swift
      - path: ../../app/Glue/PairingFileValidator.swift
      - path: ../../app/Glue/AirBridge/CofreBackendAdapter.swift
      - path: ../../app/Glue/AirBridge/CofrePreferences.swift
      - path: ../../app/Glue/AirBridge/CofreBackendAdapter+Instances.swift
      - path: ../../app/Glue/AirBridge/CofreBackendAdapter+Mods.swift
      - path: ../../app/Glue/AirBridge/CofreBackendAdapter+Modpacks.swift
      - path: ../../app/Glue/AirBridge/CofreScenarioRunner.swift
      - path: ../../app/Glue/AirBridge/CofreBackendAdapter+Servers.swift
      - path: ../../app/Glue/AirBridge/CofreBackendAdapter+Downloads.swift
      - path: ../../app/Glue/AirBridge/CofreBackendAdapter+Requirements.swift
      - path: ../../app/Glue/AirBridge/ServerJoinAdapter.swift
      - path: ../../app/Glue/AirBridge/CofreCoreEntry.swift
      - path: ../../app/Glue/AirBridge/CofreGameExit.swift
      - path: ../../app/Glue/AirBridge/CofreGameInput.swift
      - path: ../../app/Shell/CofreRootViewController.swift
      - path: ../../app/Glue/CofreJIT.swift
      - path: ../../app/Glue/CofreVPN.swift
      - path: ../../app/Glue/ProvisioningProfile.swift
    dependencies:
      - package: CofreUI
        product: CofreUI
      - package: CofreUI
        product: CofreKit
      - package: CofreServerJoin
        product: CofreServerJoin
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ignacio.cofre.core
      DEFINES_MODULE: YES
      MACH_O_TYPE: mh_dylib
      GENERATE_INFOPLIST_FILE: YES
      ARCHS: arm64
      SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../../app/Glue/AirBridge/CofreAirBridging.h
      SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../../app/UI/build/Debug-iphoneos $(SRCROOT)/../../app/ServerJoin/build/Debug-iphoneos"
  CofreCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../tests/preferences/CofrePreferencesTests.swift
    dependencies:
      - target: CofreCore
      - package: CofreUI
        product: CofreUI
      - package: CofreUI
        product: CofreKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ignacio.cofre.core.tests
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../app/UI/Sources/CofreKit/JITProtocol.swift
      - path: ../../app/Glue/CofreConstants.swift
      - path: ../../extensions/PacketTunnel
      - path: ../../.work/stikjit/Sources
      - path: ../../upstream/stikjit/Resources
        buildPhase: resources
      - path: ../../extensions/PacketTunnel/CofreTXM.js
        buildPhase: resources
      - path: ../../upstream/stikjit/idevice/module.modulemap
        buildPhase: sources
      - path: ../../upstream/stikjit/iokit/module.modulemap
        buildPhase: sources
    dependencies:
      - sdk: JavaScriptCore.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: IOKit.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${TUNNEL_BUNDLE_ID}
      INFOPLIST_FILE: PacketTunnel-Info.plist
      CODE_SIGN_ENTITLEMENTS: Tunnel.entitlements
      SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../../extensions/PacketTunnel/TunnelRoute.h
      SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../../upstream/stikjit/idevice $(SRCROOT)/../../upstream/stikjit/iokit"
      HEADER_SEARCH_PATHS: "$(SRCROOT)/../../upstream/stikjit/idevice $(SRCROOT)/../../upstream/stikjit/iokit"
      LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../upstream/stikjit/idevice"
      OTHER_LDFLAGS: "$(inherited) -Wl,-hidden-lidevice_ffi"
schemes:
  CofreSigning:
    build:
      targets:
        Cofre: all
        CofreCore: all
        PacketTunnel: all
